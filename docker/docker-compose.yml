version: "3.9"
services:
  postgres:
    image: postgres:16
    container_name: pg_lab
    restart: unless-stopped
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - lab_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter
    container_name: pg_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://labuser:changeme@postgres:5432/reliability_lab?sslmode=disable"
    ports:
      - "9187:9187"
    networks:
      - lab_net
    depends_on:
      - postgres

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - lab_net
    depends_on:
      - postgres-exporter

  grafana:
    image: grafana/grafana
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - lab_net
    depends_on:
      - prometheus

volumes:
  pg_data:

networks:
  lab_net: